<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bazinga BET</title>
  <link rel="icon" type="image/webp" href="assets/logo/icone.webp" />
  <!-- A moldura da musica de fundo foi removida (v1.31). Links antigos no formato
       app.html#games/crash.html continuam funcionando: vao direto para a pagina. -->
  <script>
    (function () {
      var p = decodeURIComponent(location.hash.slice(1) || "").replace(/^\//, "");
      var ok = /^[a-z0-9_\-\/]+\.html(\?[a-z0-9_=&%\-.]*)?$/i.test(p) && p.indexOf("..") === -1 && !/^app\.html/.test(p);
      location.replace(ok ? p : "index.html");
    })();
  </script>
</head>
<body style="background:#0f1923"></body>
</html>
