<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Laboratório de Animações — Bazinga BET</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <script src="js/core/theme.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .lab-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
    .lab-grid .btn { padding: 14px 10px; font-size: 15px; }
    .lab-grid small { display: block; font-weight: 600; opacity: 0.75; font-size: 11.5px; margin-top: 3px; }
    .lab-row { display: flex; flex-wrap: wrap; gap: 14px; align-items: end; margin-bottom: 18px; }
    .lab-row label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
    .lab-stage { position: relative; min-height: 220px; display: grid; place-items: center; font-size: 64px; }
  </style>
</head>
<!-- Pagina de testes das animacoes (fora do menu). Dispara as comemoracoes de vitoria
     sem apostar: o saldo do topo so muda NA TELA, o saldo salvo nao e alterado. -->
<body data-page="lab" data-title="Laboratório" data-icon="🧪">
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>
    <div class="main-col">
      <header class="topbar" id="topbar"></header>
      <main class="container">
        <section class="panel">
          <h1>🧪 Laboratório de animações</h1>
          <p style="color:var(--text-muted)">Dispare as comemorações sem apostar. O saldo do topo muda só na tela; o seu saldo de verdade não é alterado (recarregue a página para voltar).</p>
        </section>

        <section class="panel" style="margin-top:16px">
          <div class="lab-row">
            <div>
              <label for="lab-bet">Aposta (BZ$)</label>
              <input id="lab-bet" class="input" type="number" min="1" value="100" style="width:130px" />
            </div>
            <div>
              <label for="lab-host">Personagem (jogo)</label>
              <select id="lab-host" class="input">
                <option value="lab">🐣 Pitoco (mascote da casa)</option>
                <option value="crash">🛶 Canoa Furada (Crash)</option>
                <option value="mines">🥒 Pikles (Mines)</option>
                <option value="tower">🗑️ Linden (Tower)</option>
                <option value="plinko">🎃 Abóbora (Plinko)</option>
                <option value="dice">🪖 616 (Dado)</option>
                <option value="hilo">🍰 Panetone (HiLo)</option>
                <option value="blackjack">🍑 Bogão (21)</option>
                <option value="coinflip">🔋 Pilha (Moeda)</option>
                <option value="bazinguinha">😎 O Menor Quentão (Bazinguinha)</option>
              </select>
            </div>
          </div>
          <div class="lab-grid">
            <button class="btn" data-mult="1.5">1,5x<small>vitória comum</small></button>
            <button class="btn" data-mult="3">3x<small>vitória comum</small></button>
            <button class="btn" data-mult="7">7x<small>vitória boa</small></button>
            <button class="btn btn--gold" data-mult="12">12x<small>Grande Vitória</small></button>
            <button class="btn btn--gold" data-mult="32">32x<small>Grande → Mega</small></button>
            <button class="btn btn--primary" data-mult="120">120x<small>até BAZINGA!</small></button>
          </div>
        </section>

        <section class="panel stage lab-stage" id="lab-stage" style="margin-top:16px">🎰</section>
      </main>
    </div>
  </div>
  <div id="toast-container"></div>
  <script src="js/core/storage.js"></script>
  <script src="js/core/sounds.js"></script>
  <script src="js/core/ui.js"></script>
  <script src="js/core/bots.js"></script>
  <script src="js/core/layout.js"></script>
  <script src="js/core/particles.js"></script>
  <script src="js/core/motion.js"></script>
  <script src="js/core/effects.js"></script>
  <script src="js/core/micro.js"></script>
  <script src="js/core/modes.js"></script>
  <script src="js/core/battlepass.js"></script>
  <script src="js/core/collectibles.js"></script>
  <script>
    (function () {
      var shown = BZG.storage.getBalance();
      var stage = document.getElementById("lab-stage");
      document.getElementById("lab-host").addEventListener("change", function () {
        document.body.setAttribute("data-page", this.value);
      });
      document.querySelectorAll("[data-mult]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          var bet = Math.max(1, Number(document.getElementById("lab-bet").value) || 100);
          var mult = Number(btn.getAttribute("data-mult"));
          var amount = Math.round(bet * mult);
          shown += amount;
          BZG.ui.refreshBalance(shown); // so na tela
          BZG.effects.win({ amount: amount, mult: mult, from: stage, stage: stage });
        });
      });
    })();
  </script>
</body>
</html>
