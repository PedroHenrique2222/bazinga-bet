<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bazinga BET</title>
  <link rel="icon" type="image/webp" href="assets/logo/icone.webp" />
  <script src="js/core/theme.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="lobby" data-title="Lobby" data-icon="🏠">
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>
    <div class="main-col">
      <header class="topbar" id="topbar"></header>
      <main class="container">

        <div class="banner" id="banner" aria-roledescription="carrossel" aria-label="Jogos em destaque">
          <div class="banner-track" id="banner-track"></div>
          <button type="button" class="banner-arrow banner-arrow--prev" id="banner-prev" aria-label="Jogo anterior">&#8249;</button>
          <button type="button" class="banner-arrow banner-arrow--next" id="banner-next" aria-label="Próximo jogo">&#8250;</button>
          <div class="banner-dots" id="banner-dots"></div>
        </div>

        <section class="lobby-section">
          <h2 class="section-title">🎮 Todos os jogos</h2>
          <div class="lobby-grid" id="games-grid"></div>
        </section>

        <section class="lobby-section">
          <h2 class="section-title">🕹️ Minigames (sem aposta)</h2>
          <div class="lobby-grid" id="minigames-grid"></div>
        </section>

        <section class="lobby-section">
          <h2 class="section-title">🧾 Suas últimas apostas</h2>
          <div class="bets-table" id="recent-bets"></div>
        </section>

        <section class="panel" style="margin-top:20px;">
          <h2 class="section-title">📊 Suas estatísticas</h2>
          <div class="stats-grid" id="stats-grid"></div>
        </section>

      </main>
    </div>
  </div>

  <div id="toast-container"></div>

  <script src="js/core/storage.js"></script>
  <script src="js/core/sounds.js"></script>
  <script src="js/core/ui.js"></script>
  <script src="js/core/bots.js"></script>
  <script src="js/core/icons.js"></script>
  <script src="js/core/layout.js"></script>
  <script src="js/core/particles.js"></script>
  <script src="js/core/effects.js"></script>
  <script src="js/core/achievements.js"></script>
  <script src="js/core/modes.js"></script>
  <script src="js/core/battlepass.js"></script>
  <script src="js/core/collectibles.js"></script>
  <script src="js/pages/lobby.js"></script>
</body>
</html>
