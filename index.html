<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bazinga BET</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <script src="js/core/theme.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="lobby" data-title="Lobby" data-icon="🏠">
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>
    <div class="main-col">
      <header class="topbar" id="topbar"></header>
      <main class="container">

        <div class="banner" id="banner">
          <div class="banner-slide banner-slide--1 active">
            <div class="banner-copy">
              <h2>🛶 CANOA FURADA AO VIVO</h2>
              <p>Rodadas o tempo todo. Retire antes de afundar!</p>
              <a class="btn btn--gold" href="games/crash.html">Jogar agora</a>
            </div>
            <div class="banner-emoji">🚀</div>
          </div>
          <div class="banner-slide banner-slide--2">
            <div class="banner-copy">
              <h2>🎡 DOUBLE — BRANCO PAGA 14x</h2>
              <p>Vermelho, preto ou branco. A roleta não para.</p>
              <a class="btn btn--gold" href="games/double.html">Girar roleta</a>
            </div>
            <div class="banner-emoji">🎡</div>
          </div>
          <div class="banner-slide banner-slide--3">
            <div class="banner-copy">
              <h2>🗑️ LIXEIRA DO LINDEN</h2>
              <p>Suba 8 níveis de lixo, multiplicadores até 25x!</p>
              <a class="btn btn--primary" href="games/tower.html">Desafiar</a>
            </div>
            <div class="banner-emoji">🗼</div>
          </div>
          <div class="banner-dots" id="banner-dots"></div>
        </div>

        <section class="lobby-section">
          <h2 class="section-title">🎮 Todos os jogos</h2>
          <div class="lobby-grid" id="games-grid"></div>
        </section>

        <section class="panel" style="margin-top:20px;">
          <h2 class="section-title">📊 Suas estatísticas</h2>
          <div class="stats-grid" id="stats-grid"></div>
        </section>

      </main>
    </div>
  </div>

  <div id="toast-container"></div>

  <script src="js/core/storage.js"></script>
  <script src="js/core/sounds.js"></script>
  <script src="js/core/ui.js"></script>
  <script src="js/core/bots.js"></script>
  <script src="js/core/layout.js"></script>
  <script src="js/core/particles.js"></script>
  <script src="js/core/effects.js"></script>
  <script src="js/core/achievements.js"></script>
  <script src="js/core/modes.js"></script>
  <script src="js/core/battlepass.js"></script>
  <script src="js/core/collectibles.js"></script>
  <script src="js/pages/lobby.js"></script>
</body>
</html>
