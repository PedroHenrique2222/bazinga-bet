<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Double — Bazinga BET</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <script src="js/core/theme.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/games/double.css" />
</head>
<body data-page="double" data-title="Double" data-icon="🎡">
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>
    <div class="main-col">
      <header class="topbar" id="topbar"></header>
      <main class="container">

        <div class="game-layout">
          <section class="panel controls">
            <label for="bet-amount">Valor da aposta (BZ$)</label>
            <input type="number" id="bet-amount" min="1" step="1" value="100" />
            <div class="input-row" style="margin-top:8px;">
              <button class="btn btn--ghost" id="bet-half">½</button>
              <button class="btn btn--ghost" id="bet-double">2x</button>
              <button class="btn btn--ghost" id="bet-max">Máx</button>
            </div>

            <label>Escolha a cor</label>
            <div class="color-options">
              <button class="color-btn color-btn--red" data-color="red">
                <span>Vermelho</span><small>2x</small>
              </button>
              <button class="color-btn color-btn--black" data-color="black">
                <span>Preto</span><small>2x</small>
              </button>
              <button class="color-btn color-btn--white" data-color="white">
                <span>Branco</span><small>14x</small>
              </button>
            </div>

            <button id="bet-btn" class="btn btn--primary" style="width:100%; margin-top:22px; padding:14px; font-size:16px;">
              Apostar
            </button>

            <p id="round-status" style="color:var(--text-muted); font-size:13px; margin-top:14px;">
              Escolha o valor e uma cor antes da roleta girar.
            </p>

            <div class="history-list">
              <h2 class="section-title" style="margin-top:20px;">Suas últimas apostas</h2>
              <div id="history-list"></div>
            </div>
          </section>

          <div>
            <section class="panel stage" id="double-stage">
              <div class="double-results" id="double-results"></div>
              <div class="round-id" id="round-id"></div>
              <div class="double-viewport" id="double-viewport">
                <div class="double-track" id="double-track"></div>
                <div class="double-pointer"></div>
              </div>
              <div class="round-countdown" id="round-countdown">
                <span class="label">Girando em</span>
                <span class="time" id="countdown-time">10.0s</span>
                <div class="countdown-bar"><div class="fill" id="countdown-fill"></div></div>
              </div>
            </section>

            <section class="panel" style="margin-top:20px;">
              <h2 class="section-title">Apostas da rodada</h2>
              <div class="double-bets-columns">
                <div class="double-bets-col" data-col="red">
                  <div class="col-head col-head--red">🔴 Vermelho <span id="sum-red"></span></div>
                  <div id="bets-red"></div>
                </div>
                <div class="double-bets-col" data-col="black">
                  <div class="col-head col-head--black">⚫ Preto <span id="sum-black"></span></div>
                  <div id="bets-black"></div>
                </div>
                <div class="double-bets-col" data-col="white">
                  <div class="col-head col-head--white">⚪ Branco <span id="sum-white"></span></div>
                  <div id="bets-white"></div>
                </div>
              </div>
            </section>
          </div>
        </div>

      </main>
    </div>
  </div>

  <div id="toast-container"></div>

  <script src="js/core/storage.js"></script>
  <script src="js/core/sounds.js"></script>
  <script src="js/core/ui.js"></script>
  <script src="js/core/bots.js"></script>
  <script src="js/core/layout.js"></script>
  <script src="js/core/particles.js"></script>
  <script src="js/core/effects.js"></script>
  <script src="js/core/achievements.js"></script>
  <script src="js/core/modes.js"></script>
  <script src="js/core/battlepass.js"></script>
  <script src="js/games/double.js"></script>
</body>
</html>
