<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Passe de Batalha — Bazinga BET</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <script src="js/core/theme.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/pages/passe.css" />
</head>
<body data-page="passe" data-title="Passe de Batalha" data-icon="🎫">
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>
    <div class="main-col">
      <header class="topbar" id="topbar"></header>
      <main class="container">

        <section class="panel bp-hero">
          <div class="bp-hero-top">
            <div>
              <h1>🎫 Passe de Batalha BZG</h1>
              <p>Aposte em qualquer jogo para ganhar XP e subir de nível. Cada nível libera uma recompensa!</p>
            </div>
            <button class="btn btn--gold" id="claim-all-btn">Resgatar tudo</button>
          </div>
          <div class="bp-progress">
            <div class="bp-progress-info">
              <span id="bp-tier-label">Nível 0</span>
              <span id="bp-xp-label" style="color:var(--text-muted);"></span>
            </div>
            <div class="bp-bar"><div class="bp-fill" id="bp-fill"></div></div>
          </div>
        </section>

        <section class="panel" style="margin-top:20px;">
          <h2 class="section-title">🎁 Recompensas</h2>
          <div class="bp-track" id="bp-track"></div>
        </section>

      </main>
    </div>
  </div>

  <div id="toast-container"></div>

  <script src="js/core/storage.js"></script>
  <script src="js/core/sounds.js"></script>
  <script src="js/core/ui.js"></script>
  <script src="js/core/bots.js"></script>
  <script src="js/core/layout.js"></script>
  <script src="js/core/particles.js"></script>
  <script src="js/core/effects.js"></script>
  <script src="js/core/achievements.js"></script>
  <script src="js/core/modes.js"></script>
  <script src="js/core/battlepass.js"></script>
  <script src="js/pages/passe.js"></script>
</body>
</html>
