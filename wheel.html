<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Roda da Sorte — Bazinga BET</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <script src="js/core/theme.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/games/wheel.css" />
</head>
<body data-page="wheel" data-title="Roda da Sorte" data-icon="🎡">
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>
    <div class="main-col">
      <header class="topbar" id="topbar"></header>
      <main class="container">

        <div class="game-layout">
          <section class="panel controls">
            <label for="bet-amount">Valor da aposta (BZ$)</label>
            <input type="number" id="bet-amount" min="1" step="1" value="100" />
            <div class="input-row" style="margin-top:8px;">
              <button class="btn btn--ghost" id="bet-half">½</button>
              <button class="btn btn--ghost" id="bet-double">2x</button>
              <button class="btn btn--ghost" id="bet-max">Máx</button>
            </div>

            <label>Nível de risco</label>
            <div class="risk-options" id="risk-options">
              <button class="btn btn--ghost active" data-risk="low">Baixo</button>
              <button class="btn btn--ghost" data-risk="medium">Médio</button>
              <button class="btn btn--ghost" data-risk="high">Alto</button>
            </div>

            <button id="spin-btn" class="btn btn--primary" style="width:100%; margin-top:22px; padding:14px; font-size:16px;">
              Girar a roda
            </button>

            <p id="round-status" style="color:var(--text-muted); font-size:13px; margin-top:14px;">
              Escolha o risco e gire. Onde parar, é seu multiplicador.
            </p>

            <div class="history-list">
              <h2 class="section-title" style="margin-top:20px;">Últimos giros</h2>
              <div id="history-list"></div>
            </div>
          </section>

          <section class="panel stage" id="wheel-stage">
            <div class="wheel-wrap">
              <div class="wheel-pointer"></div>
              <canvas id="wheel-canvas" width="380" height="380"></canvas>
              <div class="wheel-center" id="wheel-center">🎡</div>
            </div>
            <div class="wheel-result" id="wheel-result">Gire a roda!</div>
          </section>
        </div>

      </main>
    </div>
  </div>

  <div id="toast-container"></div>

  <script src="js/core/storage.js"></script>
  <script src="js/core/sounds.js"></script>
  <script src="js/core/ui.js"></script>
  <script src="js/core/bots.js"></script>
  <script src="js/core/layout.js"></script>
  <script src="js/core/particles.js"></script>
  <script src="js/core/effects.js"></script>
  <script src="js/core/achievements.js"></script>
  <script src="js/core/modes.js"></script>
  <script src="js/core/battlepass.js"></script>
  <script src="js/games/wheel.js"></script>
</body>
</html>
