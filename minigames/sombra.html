<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sombra Rápida — Bazinga BET</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
  <script src="../js/core/theme.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/minigames/sombra.css" />
</head>
<body data-page="shadow-minigame" data-title="Sombra Rápida" data-icon="🌑">
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>
    <div class="main-col">
      <header class="topbar" id="topbar"></header>
      <main class="container">

        <section class="panel sombra-hero">
          <h1>🌑 Sombra Rápida <span class="sombra-host">com Shadow</span></h1>
          <p>Minigame sem aposta — um olho aparece rapidamente em algum canto escuro. Clique nele antes que suma! Você tem 30 segundos por rodada.</p>
        </section>

        <div class="game-layout">
          <section class="panel controls">
            <label>Tempo restante</label>
            <div class="sombra-timer" id="sombra-timer">30s</div>

            <label>Acertos nesta rodada</label>
            <div class="sombra-score" id="sombra-score">0</div>

            <label>Seu recorde</label>
            <div class="sombra-best" id="sombra-best">0 acertos</div>

            <button id="sombra-action-btn" class="btn btn--primary" style="width:100%; margin-top:22px; padding:14px; font-size:16px;">
              Começar
            </button>

            <p id="sombra-status" style="color:var(--text-muted); font-size:13px; margin-top:14px;">
              Clique em "Começar" e fique de olho nas sombras.
            </p>
          </section>

          <div>
            <section class="panel stage sombra-stage" id="sombra-stage">
              <div class="sombra-grid" id="sombra-grid"></div>
              <div class="sombra-gameover" id="sombra-gameover">
                <div class="sombra-gameover-title">Tempo esgotado!</div>
                <div class="sombra-gameover-score" id="sombra-gameover-score">0 acertos</div>
                <div class="sombra-gameover-sub" id="sombra-gameover-sub"></div>
                <button class="btn btn--gold" id="sombra-retry-btn">Jogar de novo</button>
              </div>
            </section>
          </div>
        </div>

      </main>
    </div>
  </div>

  <div id="toast-container"></div>

  <script src="../js/core/storage.js"></script>
  <script src="../js/core/sounds.js"></script>
  <script src="../js/core/ui.js"></script>
  <script src="../js/core/bots.js"></script>
  <script src="../js/core/layout.js"></script>
  <script src="../js/core/particles.js"></script>
  <script src="../js/core/effects.js"></script>
  <script src="../js/core/achievements.js"></script>
  <script src="../js/core/modes.js"></script>
  <script src="../js/core/battlepass.js"></script>
  <script src="../js/core/collectibles.js"></script>
  <script src="../js/minigames/sombra.js"></script>
</body>
</html>
