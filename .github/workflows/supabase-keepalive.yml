# Mantem o Supabase do ranking acordado.
# O plano gratuito pausa o projeto depois de ~7 dias sem atividade; este workflow faz
# uma leitura real no banco (tabela leaderboard) a cada 3 dias. A URL e a chave publica
# sao lidas de js/core/leaderboard.js, entao so existe um lugar pra atualizar.
#
# O GitHub desliga workflows agendados em repos sem commits por 60 dias; o ultimo passo
# reativa o proprio workflow a cada execucao pra isso nao acontecer.
name: Supabase keep-alive

on:
  schedule:
    - cron: "17 9 */3 * *" # a cada 3 dias, 06:17 de Brasilia
  workflow_dispatch: # botao "Run workflow" pra testar na hora

permissions:
  contents: read
  actions: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ler URL e chave do leaderboard.js
        run: |
          url=$(grep -oP 'SUPABASE_URL\s*=\s*"\K[^"]+' js/core/leaderboard.js)
          key=$(grep -oP 'SUPABASE_ANON_KEY\s*=\s*"\K[^"]+' js/core/leaderboard.js)
          if [ -z "$url" ] || [ -z "$key" ]; then
            echo "::error::Nao achei SUPABASE_URL/SUPABASE_ANON_KEY em js/core/leaderboard.js"
            exit 1
          fi
          echo "SB_URL=$url" >> "$GITHUB_ENV"
          echo "SB_KEY=$key" >> "$GITHUB_ENV"

      - name: Consultar o banco
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o body.json -w '%{http_code}' \
              "$SB_URL/rest/v1/leaderboard?select=id&limit=1" \
              -H "apikey: $SB_KEY")
            echo "Tentativa $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            cat body.json; echo
            sleep 30
          done
          echo "::error::Supabase nao respondeu 200. Ele pode ter sido pausado: reative em https://supabase.com/dashboard"
          exit 1

      - name: Impedir que o GitHub desative este agendamento
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/supabase-keepalive.yml/enable"
