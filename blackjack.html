<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blackjack — Bazinga BET</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <script src="js/core/theme.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/games/blackjack.css" />
</head>
<body data-page="blackjack" data-title="Blackjack" data-icon="🎭">
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>
    <div class="main-col">
      <header class="topbar" id="topbar"></header>
      <main class="container">

        <div class="game-layout">
          <section class="panel controls">
            <label for="bet-amount">Valor da aposta (BZ$)</label>
            <input type="number" id="bet-amount" min="1" step="1" value="100" />
            <div class="input-row" style="margin-top:8px;">
              <button class="btn btn--ghost" id="bet-half">½</button>
              <button class="btn btn--ghost" id="bet-double">2x</button>
              <button class="btn btn--ghost" id="bet-max">Máx</button>
            </div>

            <button id="deal-btn" class="btn btn--primary" style="width:100%; margin-top:22px; padding:14px; font-size:16px;">
              Distribuir cartas
            </button>

            <div class="bj-actions" id="bj-actions" style="display:none;">
              <button class="btn btn--primary" id="hit-btn">Pedir</button>
              <button class="btn btn--gold" id="stand-btn">Parar</button>
              <button class="btn btn--ghost" id="double-btn">Dobrar</button>
            </div>

            <p id="round-status" style="color:var(--text-muted); font-size:13px; margin-top:14px;">
              Chegue mais perto de 21 que o dealer, sem estourar. Blackjack paga 2.5x!
            </p>

            <div class="history-list">
              <h2 class="section-title" style="margin-top:20px;">Últimas mãos</h2>
              <div id="history-list"></div>
            </div>
          </section>

          <section class="panel stage" id="bj-stage">
            <div class="bj-table">
              <div class="bj-hand-area">
                <div class="bj-hand-label">Dealer <span class="bj-total" id="dealer-total"></span></div>
                <div class="bj-cards" id="dealer-cards"></div>
              </div>
              <div class="bj-vs" id="bj-message"></div>
              <div class="bj-hand-area">
                <div class="bj-hand-label">Você <span class="bj-total" id="player-total"></span></div>
                <div class="bj-cards" id="player-cards"></div>
              </div>
            </div>
          </section>
        </div>

      </main>
    </div>
  </div>

  <div id="toast-container"></div>

  <script src="js/core/storage.js"></script>
  <script src="js/core/sounds.js"></script>
  <script src="js/core/ui.js"></script>
  <script src="js/core/bots.js"></script>
  <script src="js/core/layout.js"></script>
  <script src="js/core/particles.js"></script>
  <script src="js/core/effects.js"></script>
  <script src="js/games/blackjack.js"></script>
</body>
</html>
