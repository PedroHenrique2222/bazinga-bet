<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bazinguinha — Bazinga BET</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
  <script src="../js/core/theme.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/games/bazinguinha.css" />
</head>
<body data-page="bazinguinha" data-title="Bazinguinha" data-icon="🐯" data-dev="true">
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>
    <div class="main-col">
      <header class="topbar" id="topbar"></header>
      <main class="container">

        <div class="game-layout">
          <section class="panel controls">
            <label for="bet-amount">Valor da aposta (BZ$)</label>
            <input type="number" id="bet-amount" min="1" step="1" value="100" />
            <div class="input-row" style="margin-top:8px;">
              <button class="btn btn--ghost" id="bet-half">½</button>
              <button class="btn btn--ghost" id="bet-double">2x</button>
              <button class="btn btn--ghost" id="bet-max">Máx</button>
            </div>

            <p id="round-status" style="color:var(--text-muted); font-size:13px; margin-top:14px;">
              5 linhas: 3 horizontais + 2 diagonais. O ⚡ é curinga e substitui qualquer símbolo.
            </p>

            <div class="paytable">
              <h2 class="section-title" style="margin-top:20px;">Prêmios por linha</h2>
              <div class="paytable-row"><span>⚡⚡⚡ WILD</span><strong>50x</strong></div>
              <div class="paytable-row"><span>🍑🍑🍑</span><strong>12.5x</strong></div>
              <div class="paytable-row"><span>🍰🍰🍰</span><strong>5x</strong></div>
              <div class="paytable-row"><span>🥒🥒🥒</span><strong>2.5x</strong></div>
              <div class="paytable-row"><span>🔋🔋🔋</span><strong>1.5x</strong></div>
              <div class="paytable-row"><span>🎃🎃🎃</span><strong>1x</strong></div>
              <div class="paytable-row"><span>💥 Tela cheia</span><strong>ganho ×10</strong></div>
            </div>

            <div class="history-list">
              <h2 class="section-title" style="margin-top:20px;">Últimos giros</h2>
              <div id="history-list"></div>
            </div>
          </section>

          <section class="panel stage" id="tiger-stage">
            <div class="ft-machine">
              <div class="ft-top">
                <div class="ft-mascot">🐯</div>
                <div class="ft-title">BAZINGUINHA</div>
              </div>

              <div class="ft-body">
                <div class="ft-side" id="ft-side-left">
                  <span class="ft-line-dot" data-line="1">2</span>
                  <span class="ft-line-dot" data-line="0">1</span>
                  <span class="ft-line-dot" data-line="2">3</span>
                </div>

                <div class="ft-window">
                  <div class="ft-grid" id="ft-grid">
                    <div class="ft-col"><div class="ft-strip" id="fstrip-0"></div></div>
                    <div class="ft-col"><div class="ft-strip" id="fstrip-1"></div></div>
                    <div class="ft-col"><div class="ft-strip" id="fstrip-2"></div></div>
                  </div>
                  <svg class="ft-winlines" id="ft-winlines" viewBox="0 0 300 300" preserveAspectRatio="none"></svg>
                </div>

                <div class="ft-side" id="ft-side-right">
                  <span class="ft-line-dot" data-line="3">4</span>
                  <span class="ft-line-dot" data-line="0">1</span>
                  <span class="ft-line-dot" data-line="4">5</span>
                </div>
              </div>

              <div class="ft-banner" id="ft-banner">⚡ Ganhe até 2500x! ⚡</div>

              <div class="ft-bar">
                <div class="ft-bar-item"><span>Saldo</span><strong id="ft-balance">—</strong></div>
                <div class="ft-bar-item"><span>Aposta</span><strong id="ft-bet">—</strong></div>
                <div class="ft-bar-item"><span>Ganho</span><strong id="ft-win">BZ$ 0</strong></div>
              </div>

              <div class="ft-controls">
                <button class="ft-adj" id="ft-minus" title="Diminuir aposta">−</button>
                <button class="ft-spin-btn" id="ft-spin" title="Girar"><span>⟳</span></button>
                <button class="ft-adj" id="ft-plus" title="Aumentar aposta">+</button>
              </div>
            </div>
          </section>
        </div>

      </main>
    </div>
  </div>

  <div id="toast-container"></div>

  <script src="../js/core/storage.js"></script>
  <script src="../js/core/sounds.js"></script>
  <script src="../js/core/ui.js"></script>
  <script src="../js/core/bots.js"></script>
  <script src="../js/core/layout.js"></script>
  <script src="../js/core/particles.js"></script>
  <script src="../js/core/effects.js"></script>
  <script src="../js/core/achievements.js"></script>
  <script src="../js/core/modes.js"></script>
  <script src="../js/core/battlepass.js"></script>
  <script src="../js/games/bazinguinha.js"></script>
</body>
</html>
