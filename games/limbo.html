<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Limbo — Bazinga BET</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
  <script src="../js/core/theme.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/games/limbo.css" />
</head>
<body data-page="limbo" data-title="Limbo" data-icon="📉">
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>
    <div class="main-col">
      <header class="topbar" id="topbar"></header>
      <main class="container">

        <div class="game-layout">
          <section class="panel controls">
            <label for="bet-amount">Valor da aposta (BZ$)</label>
            <input type="number" id="bet-amount" min="1" step="1" value="100" />
            <div class="input-row" style="margin-top:8px;">
              <button class="btn btn--ghost" id="bet-half">½</button>
              <button class="btn btn--ghost" id="bet-double">2x</button>
              <button class="btn btn--ghost" id="bet-max">Máx</button>
            </div>

            <label for="target-input">Multiplicador alvo</label>
            <input type="number" id="target-input" min="1.01" step="0.1" value="2.00" />

            <div class="limbo-info">
              <div><span>Chance de ganhar</span><strong id="win-chance">49.50%</strong></div>
              <div><span>Prêmio se ganhar</span><strong id="win-payout">BZ$ 200</strong></div>
            </div>

            <button id="roll-btn" class="btn btn--primary" style="width:100%; margin-top:18px; padding:14px; font-size:16px;">
              Apostar
            </button>

            <p id="round-status" style="color:var(--text-muted); font-size:13px; margin-top:14px;">
              Se o multiplicador sorteado for maior ou igual ao seu alvo, você ganha.
            </p>

            <div class="history-list">
              <h2 class="section-title" style="margin-top:20px;">Últimas rodadas</h2>
              <div id="history-list"></div>
            </div>
          </section>

          <section class="panel stage" id="limbo-stage">
            <div class="limbo-recent" id="limbo-recent"></div>
            <div class="limbo-result" id="limbo-result">0.00x</div>
            <div class="limbo-target-label" id="limbo-target-label">Alvo: 2.00x</div>
          </section>
        </div>

      </main>
    </div>
  </div>

  <div id="toast-container"></div>

  <script src="../js/core/storage.js"></script>
  <script src="../js/core/sounds.js"></script>
  <script src="../js/core/ui.js"></script>
  <script src="../js/core/bots.js"></script>
  <script src="../js/core/layout.js"></script>
  <script src="../js/core/particles.js"></script>
  <script src="../js/core/effects.js"></script>
  <script src="../js/core/achievements.js"></script>
  <script src="../js/core/modes.js"></script>
  <script src="../js/core/battlepass.js"></script>
  <script src="../js/core/collectibles.js"></script>
  <script src="../js/games/limbo.js"></script>
</body>
</html>
