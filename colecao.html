<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coleção — Bazinga BET</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <script src="js/core/theme.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/pages/colecao.css" />
</head>
<body data-page="colecao" data-title="Coleção" data-icon="🎴">
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>
    <div class="main-col">
      <header class="topbar" id="topbar"></header>
      <main class="container">

        <section class="panel col-hero">
          <div class="col-hero-top">
            <div>
              <h1>🎴 Coleção BZG</h1>
              <p>Um álbum de figurinhas de cada lenda da equipe. Toda aposta tem uma chance de soltar uma figurinha nova — complete o álbum de um personagem para desbloquear o avatar dele!</p>
            </div>
            <div class="col-total" id="col-total">0 / 80</div>
          </div>
          <div class="col-tabs">
            <button class="col-tab active" id="tab-album">Álbum</button>
            <button class="col-tab col-tab--dev" id="tab-loja" title="Em desenvolvimento">Loja <span class="nav-dev">EM BREVE</span></button>
          </div>
        </section>

        <div id="album-view">
          <div id="characters-list"></div>
        </div>

      </main>
    </div>
  </div>

  <div id="toast-container"></div>

  <script src="js/core/storage.js"></script>
  <script src="js/core/sounds.js"></script>
  <script src="js/core/ui.js"></script>
  <script src="js/core/bots.js"></script>
  <script src="js/core/layout.js"></script>
  <script src="js/core/particles.js"></script>
  <script src="js/core/effects.js"></script>
  <script src="js/core/achievements.js"></script>
  <script src="js/core/modes.js"></script>
  <script src="js/core/battlepass.js"></script>
  <script src="js/core/collectibles.js"></script>
  <script src="js/pages/colecao.js"></script>
</body>
</html>
