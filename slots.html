<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Slots — Bazinga BET</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <script src="js/core/theme.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/games/slots.css" />
</head>
<body data-page="slots" data-title="Slots" data-icon="🎰">
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>
    <div class="main-col">
      <header class="topbar" id="topbar"></header>
      <main class="container">

        <div class="game-layout">
          <section class="panel controls">
            <label for="bet-amount">Valor da aposta (BZ$)</label>
            <input type="number" id="bet-amount" min="1" step="1" value="100" />
            <div class="input-row" style="margin-top:8px;">
              <button class="btn btn--ghost" id="bet-half">½</button>
              <button class="btn btn--ghost" id="bet-double">2x</button>
              <button class="btn btn--ghost" id="bet-max">Máx</button>
            </div>

            <button id="spin-btn" class="btn btn--primary" style="width:100%; margin-top:22px; padding:14px; font-size:16px;">
              Girar 🎰
            </button>

            <p id="round-status" style="color:var(--text-muted); font-size:13px; margin-top:14px;">
              Três símbolos iguais na linha do meio pagam grande!
            </p>

            <div class="paytable">
              <h2 class="section-title" style="margin-top:20px;">Tabela de prêmios (3 iguais)</h2>
              <div class="paytable-row"><span>⚡⚡⚡</span><strong>500x — JACKPOT</strong></div>
              <div class="paytable-row"><span>7️⃣7️⃣7️⃣</span><strong>150x</strong></div>
              <div class="paytable-row"><span>💎💎💎</span><strong>50x</strong></div>
              <div class="paytable-row"><span>⭐⭐⭐</span><strong>20x</strong></div>
              <div class="paytable-row"><span>💥💥💥</span><strong>10x</strong></div>
              <div class="paytable-row"><span>🃏🃏🃏</span><strong>5x</strong></div>
              <div class="paytable-row"><span>2x ⚡/7️⃣/💎</span><strong>1.5x</strong></div>
            </div>

            <div class="history-list">
              <h2 class="section-title" style="margin-top:20px;">Últimos giros</h2>
              <div id="history-list"></div>
            </div>
          </section>

          <section class="panel stage" id="slots-stage">
            <div class="slots-machine">
              <div class="slots-header">⚡ BAZINGA SLOTS ⚡</div>
              <div class="slots-window">
                <div class="payline payline--left">▶</div>
                <div class="slots-reels">
                  <div class="reel"><div class="reel-strip" id="reel-0"></div></div>
                  <div class="reel"><div class="reel-strip" id="reel-1"></div></div>
                  <div class="reel"><div class="reel-strip" id="reel-2"></div></div>
                </div>
                <div class="payline payline--right">◀</div>
              </div>
              <div class="slots-result" id="slots-result"></div>
            </div>
          </section>
        </div>

      </main>
    </div>
  </div>

  <div id="toast-container"></div>

  <script src="js/core/storage.js"></script>
  <script src="js/core/sounds.js"></script>
  <script src="js/core/ui.js"></script>
  <script src="js/core/bots.js"></script>
  <script src="js/core/layout.js"></script>
  <script src="js/core/particles.js"></script>
  <script src="js/core/effects.js"></script>
  <script src="js/games/slots.js"></script>
</body>
</html>
