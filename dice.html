<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dice — Bazinga BET</title>
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/dice.css" />
</head>
<body data-page="dice" data-title="Dice" data-icon="🎲">
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>
    <div class="main-col">
      <header class="topbar" id="topbar"></header>
      <main class="container">

        <div class="game-layout">
          <section class="panel controls">
            <label for="bet-amount">Valor da aposta (BZ$)</label>
            <input type="number" id="bet-amount" min="1" step="1" value="100" />
            <div class="input-row" style="margin-top:8px;">
              <button class="btn btn--ghost" id="bet-half">½</button>
              <button class="btn btn--ghost" id="bet-double">2x</button>
              <button class="btn btn--ghost" id="bet-max">Máx</button>
            </div>

            <label>Modo</label>
            <div class="risk-options">
              <button class="btn btn--ghost active" data-mode="under">Abaixo de</button>
              <button class="btn btn--ghost" data-mode="over">Acima de</button>
            </div>

            <label for="dice-threshold">Alvo: <span id="threshold-value">50</span></label>
            <input type="range" id="dice-threshold" min="2" max="98" value="50" step="1" />

            <div class="dice-info">
              <div><span>Chance de vitória</span><strong id="win-chance">49.00%</strong></div>
              <div><span>Multiplicador</span><strong id="win-mult">2.02x</strong></div>
            </div>

            <button id="roll-btn" class="btn btn--primary" style="width:100%; margin-top:18px; padding:14px; font-size:16px;">
              Rolar dado
            </button>

            <p id="round-status" style="color:var(--text-muted); font-size:13px; margin-top:14px;">
              Escolha o modo e o alvo, depois role o dado.
            </p>

            <div class="history-list">
              <h2 class="section-title" style="margin-top:20px;">Últimas rodadas</h2>
              <div id="history-list"></div>
            </div>
          </section>

          <section class="panel stage" id="dice-stage">
            <div class="dice-result" id="dice-result">00.00</div>
            <div class="dice-bar-wrap">
              <div class="dice-bar" id="dice-bar"></div>
              <div class="dice-marker dice-marker--threshold" id="dice-threshold-marker"></div>
              <div class="dice-marker dice-marker--result" id="dice-result-marker"></div>
            </div>
          </section>
        </div>

      </main>
    </div>
  </div>

  <div id="toast-container"></div>

  <script src="js/storage.js"></script>
  <script src="js/sounds.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/bots.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/particles.js"></script>
  <script src="js/effects.js"></script>
  <script src="js/dice.js"></script>
</body>
</html>
